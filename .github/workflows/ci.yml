name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # SocketTrader ships on both Windows (native NinjaTrader) and Linux
        # (WSL), and the keyboard/terminal layer differs between them, so both
        # are worth running. 3.10 is the floor — zoneinfo needs 3.9+ and 3.9
        # is end-of-life.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile the app
        run: python -m compileall -q SocketTrader.py

      - name: Run test suite
        run: python -m pytest test_sockettrader.py -q

  webui:
    name: web UI guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      # The dashboard is hand-written JS inside a Python string, so node is
      # what actually parses it — a syntax error there ships a blank page
      # that the Python test suite cannot see.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check embedded web UI
        run: python scripts/check_webui.py

  installer:
    # The Windows installer is what non-technical users actually run, and it
    # cannot be tested anywhere except Windows — so CI runs it end to end on a
    # clean runner rather than trusting that it parses.
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lint the installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

      - name: Simulate an installed NinjaTrader
        # Without a NinjaTrader 8 folder the template-filing branch of step 4
        # is dead code in CI — which is exactly how a Get-Content parameter
        # error shipped in v0.15.0. Give the installer a folder to file into.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (
            Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'NinjaTrader 8') | Out-Null

      - name: Run the installer end to end
        # Windows PowerShell 5.1 — the engine install.bat actually launches,
        # not pwsh. The two disagree on more than you'd hope.
        shell: powershell
        run: ./install.ps1 -InstallDir "$env:RUNNER_TEMP\st-install"

      - name: Verify what it produced
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\st-install"
          foreach ($f in @('SocketTrader.py', 'requirements.txt', 'SocketTrader.cmd')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing: $f" }
          }
          if (-not (Get-ChildItem (Join-Path $dir 'strategy') -Filter *.xml)) {
            throw 'strategy templates were not installed'
          }
          # Step 4 must have routed every template into NinjaTrader's two
          # template folders — ATMs and stops are read from separate places.
          $nt   = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'NinjaTrader 8'
          $atm  = Get-ChildItem (Join-Path $nt 'templates\AtmStrategy')  -Filter *.xml -ErrorAction SilentlyContinue
          $stop = Get-ChildItem (Join-Path $nt 'templates\StopStrategy') -Filter *.xml -ErrorAction SilentlyContinue
          $srcN = (Get-ChildItem (Join-Path $dir 'strategy') -Filter *.xml).Count
          if (-not $atm)  { throw 'no ATM templates were filed into NinjaTrader' }
          if (-not $stop) { throw 'no stop templates were filed into NinjaTrader (algoNQmed.xml routes there)' }
          if ($atm.Count + $stop.Count -ne $srcN) {
            throw "template routing lost files: $($atm.Count) ATM + $($stop.Count) stop != $srcN in strategy/"
          }
          # Import with the SAME interpreter the launcher will use. A Windows
          # box often has several Pythons; checking with a different one than
          # the installer pip-installed into proves nothing.
          $cmd = Get-Content (Join-Path $dir 'SocketTrader.cmd') -Raw
          if ($cmd -notmatch '(?m)^(py(\s+-3)?|python)\s+SocketTrader\.py') {
            throw "launcher does not invoke SocketTrader.py as expected:`n$cmd"
          }
          $interp = $Matches[1] -split '\s+'
          & $interp[0] @($interp[1..($interp.Length-1)]) -c `
            "import sys; sys.path.insert(0, r'$dir'); import SocketTrader; print('imports OK, v' + SocketTrader.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'app failed to import with the launcher interpreter' }
          Write-Host "installer output verified"
